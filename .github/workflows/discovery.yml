name: Scheduled job discovery
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discovery.yml'
      - 'github_discovery.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: job-hunter-discovery
  cancel-in-progress: false
jobs:
  discover:
    if: github.repository == 'mohdaatir86-droid/Autonomus-Job-Hunter-' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const endpoint = 'https://autonomous-job-hunter-docker.onrender.com/api/integrations/github/hunt';
            // A push can arrive before Render finishes deploying the new endpoint.
            for (let attempt = 0; attempt < 6; attempt++) {
              const token = await core.getIDToken(endpoint);
              let response;
              try {
                response = await fetch(endpoint, {
                  method: 'POST',
                  headers: {Authorization: `Bearer ${token}`},
                  signal: AbortSignal.timeout(240000)
                });
              } catch (error) {
                // The result of a timed-out POST is ambiguous; do not repeat it.
                core.setFailed('Discovery request could not be verified. Check private run history before retrying.');
                return;
              }
              if (response.status === 404 && attempt < 5) {
                await new Promise(resolve => setTimeout(resolve, 30000));
                continue;
              }
              if (!response.ok) {
                core.setFailed(`Discovery failed with HTTP ${response.status}; inspect the private dashboard.`);
                return;
              }
              const result = await response.json();
              // Never print source payloads, mailbox content, job URLs or credentials.
              core.info(`Run ${result.status}: fetched=${Number(result.fetched || 0)}, new=${Number(result.new_jobs || 0)}, source_issues=${(result.errors || []).length}`);
              if (!['completed', 'already_running'].includes(result.status)) {
                core.setFailed('Discovery did not report a completed run.');
              } else if ((result.errors || []).length) {
                core.warning('Some providers need attention; see private source health.');
              }
              return;
            }
