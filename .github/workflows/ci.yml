name: Python checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: job_hunter_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql://postgres:fixture-test-only@127.0.0.1:5432/job_hunter_test?sslmode=disable
      ENABLE_SCHEDULER: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q main.py job_hunter.py job_sources.py application_workflow.py gmail_alerts.py outreach.py outreach_routes.py email_alerts.py ai_assist.py notify.py
      - run: python -m pytest -q
      - run: node --check static/app.js && node --check static/outreach_campaigns.js && node --check static/contact_providers.js
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-fixture-evidence
          path: /tmp/job-hunter-browser-evidence
          if-no-files-found: ignore
