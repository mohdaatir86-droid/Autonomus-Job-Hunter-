services:
  - type: web
    name: autonomous-job-hunter
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: HUNT_INTERVAL_MINUTES
        value: "15"
      - key: DATABASE_PATH
        value: /var/data/job_hunter.db
    disk:
      name: job-hunter-data
      mountPath: /var/data
      sizeGB: 1
